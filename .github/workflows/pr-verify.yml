name: PR Verification

# Every pull request must be machine-verified. The other two workflows in this
# repository only run on `push` to main (deploy) or on `animations/**` changes
# (meta generation), so before this file existed no PR was ever checked by CI.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, typecheck, test, build, integrity
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: inspector/package-lock.json

      # ---------------------------------------------------------------- install
      - name: Install dependencies (clean, lockfile-exact)
        working-directory: inspector
        run: npm ci

      # --------------------------------------------------------------- typecheck
      - name: TypeScript check
        working-directory: inspector
        run: npx tsc -b

      # -------------------------------------------------------------------- test
      - name: Run automated tests
        working-directory: inspector
        run: npx vitest run --reporter=verbose

      # ------------------------------------------------------------------- build
      - name: Production build
        working-directory: inspector
        run: npm run build

      - name: Assert both entry points were emitted
        working-directory: inspector
        run: |
          set -euo pipefail
          test -f dist/index.html      || { echo "::error::dist/index.html (Phase 2) missing"; exit 1; }
          test -f dist/phase1.html     || { echo "::error::dist/phase1.html (Phase 1) missing"; exit 1; }
          echo "Phase 1 and Phase 2 entry points both present."
          ls -la dist

      # ---------------------------------------------------------- phase 1 check
      - name: Phase 1 regression (structure of the untouched viewer)
        working-directory: inspector
        run: |
          set -euo pipefail
          echo "--- Phase 1 sources are present and wired ---"
          test -f phase1.html            || { echo "::error::inspector/phase1.html missing"; exit 1; }
          test -f src/main.tsx           || { echo "::error::Phase 1 entry src/main.tsx missing"; exit 1; }
          grep -q "phase1" vite.config.ts || { echo "::error::vite.config.ts no longer builds phase1"; exit 1; }

          echo "--- Phase 1 disclaimers are still in place ---"
          grep -rq "NOT Unity Editor" src/ || { echo "::error::Phase 1 'NOT Unity Editor' disclaimer missing"; exit 1; }

          echo "--- Built Phase 1 bundle references its own entry ---"
          grep -q "src/main.tsx\|assets/" dist/phase1.html || { echo "::error::dist/phase1.html does not reference a bundle"; exit 1; }

      # ------------------------------------------------------- asset integrity
      # The 74 FBX files, their 74 .fbx.meta companions and the character
      # bundles are the source of truth and must never be modified by a PR.
      - name: Original asset integrity (173 tracked asset files)
        working-directory: .
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const path = require('path');

          const manifest = JSON.parse(fs.readFileSync('config/asset-manifest.json', 'utf8'));
          const problems = [];
          let checked = 0;

          for (const entry of manifest.files) {
            if (!fs.existsSync(entry.path)) {
              problems.push(`MISSING  ${entry.path}`);
              continue;
            }
            const buf = fs.readFileSync(entry.path);
            const sha = crypto.createHash('sha256').update(buf).digest('hex');
            checked++;
            if (sha !== entry.sha256) problems.push(`CHANGED  ${entry.path}`);
            else if (buf.length !== entry.bytes) problems.push(`RESIZED  ${entry.path}`);
          }

          const fbx = manifest.files.filter((f) => f.path.endsWith('.fbx')).length;
          const meta = manifest.files.filter((f) => f.path.endsWith('.fbx.meta')).length;

          console.log(`Assets verified: ${checked}/${manifest.files.length} (${fbx} .fbx, ${meta} .fbx.meta)`);

          if (fbx !== 74) problems.push(`EXPECTED 74 .fbx files, manifest has ${fbx}`);
          if (meta !== 74) problems.push(`EXPECTED 74 .fbx.meta files, manifest has ${meta}`);

          if (problems.length) {
            for (const p of problems) console.log(`::error::${p}`);
            process.exit(1);
          }
          console.log('All original assets are byte-identical to the baseline. Nothing was modified.');
          NODE

      - name: No new or removed files in animations/ or Character/
        run: |
          set -euo pipefail
          # Compare tracked file lists against the manifest, catching additions too.
          node - <<'NODE'
          const fs = require('fs');
          const { execSync } = require('child_process');
          const manifest = JSON.parse(fs.readFileSync('config/asset-manifest.json', 'utf8'));
          const expected = new Set(manifest.files.map((f) => f.path));
          const tracked = execSync('git ls-files animations Character', { encoding: 'utf8' })
            .split('\n')
            .filter(Boolean);

          const added = tracked.filter((p) => !expected.has(p));
          const removed = [...expected].filter((p) => !tracked.includes(p));

          if (added.length) for (const p of added) console.log(`::error::Unexpected new asset file: ${p}`);
          if (removed.length) for (const p of removed) console.log(`::error::Asset file disappeared: ${p}`);
          if (added.length || removed.length) process.exit(1);
          console.log(`Tracked asset list matches the manifest exactly (${tracked.length} files).`);
          NODE

      - name: Asset files were not modified by this PR (git diff vs base)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          BASE="origin/${{ github.base_ref }}"
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "$BASE"...HEAD -- animations/ Character/ || true)
          if [ -n "$CHANGED" ]; then
            echo "::error::This PR modifies protected asset files:"
            echo "$CHANGED"
            exit 1
          fi
          echo "No protected asset files were modified by this PR."
