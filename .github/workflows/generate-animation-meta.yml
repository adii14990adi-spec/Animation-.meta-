name: Generate Unity FBX Animation Metadata

on:
  push:
    paths:
      - 'animations/**/*.fbx'
      - 'animations/**/*.FBX'
      - 'animations/**/*.Fbx'
      - 'animations/**/*.meta'
      - 'config/*.json'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Processing mode (incremental checks Git-changed & missing-meta assets; full scans all FBX assets)'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - incremental
      reconfigure_existing:
        description: 'Re-apply config/importer_settings.json & animation_rules.json to existing .meta files (preserves GUIDs)'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Run FBX analysis and validation without committing .meta changes'
        required: false
        default: false
        type: boolean

# Minimal top-level read permissions by default
permissions:
  contents: read

# Prevent overlapping workflow runs on the same ref from corrupting metadata or racing pushes
concurrency:
  group: unity-fbx-animation-meta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-and-validate-meta:
    name: Analyze FBX, Generate & Validate Unity .meta
    runs-on: ubuntu-latest
    # Prevent infinite workflow loops from automation commits while always allowing manual dispatch
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.actor != 'github-actions[bot]' &&
        !contains(github.event.head_commit.message, '[skip ci]') &&
        !startsWith(github.event.head_commit.message, 'chore: generate Unity metadata for FBX animations')
      )
    permissions:
      contents: write

    steps:
      - name: Checkout repository (with Git LFS & history for rename/GUID stability checks)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Restore incremental FBX analysis & GUID cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .cache
          key: fbx-meta-cache-${{ runner.os }}-${{ hashFiles('config/*.json') }}-${{ github.sha }}
          restore-keys: |
            fbx-meta-cache-${{ runner.os }}-${{ hashFiles('config/*.json') }}-
            fbx-meta-cache-${{ runner.os }}-

      - name: Generate and maintain Unity .meta files
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_RECONFIGURE: ${{ inputs.reconfigure_existing }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          ARGS=(--repo-root .)

          if [[ "${EVENT_NAME}" == "push" ]]; then
            ARGS+=(--incremental)
            if [[ -n "${EVENT_BEFORE}" && "${EVENT_BEFORE}" != "0000000000000000000000000000000000000000" ]]; then
              ARGS+=(--base-ref "${EVENT_BEFORE}")
            fi
          elif [[ "${INPUT_MODE}" == "incremental" ]]; then
            ARGS+=(--incremental)
          fi

          if [[ "${INPUT_RECONFIGURE}" == "true" ]]; then
            ARGS+=(--reconfigure)
          fi

          if [[ "${INPUT_DRY_RUN}" == "true" ]]; then
            ARGS+=(--dry-run)
          fi

          python scripts/generate_meta.py "${ARGS[@]}"

      - name: Validate FBX assets and Unity ModelImporter metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          VAL_ARGS=(--repo-root .)
          if [[ "${EVENT_NAME}" == "push" && -n "${EVENT_BEFORE}" && "${EVENT_BEFORE}" != "0000000000000000000000000000000000000000" ]]; then
            VAL_ARGS+=(--base-ref "${EVENT_BEFORE}")
          fi
          python scripts/validate_meta.py "${VAL_ARGS[@]}"

      - name: Upload FBX analysis & validation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fbx-animation-meta-reports-${{ github.run_number }}
          path: |
            reports/*.json
            reports/*.md
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit and push generated Unity .meta files
        if: >-
          success() &&
          inputs.dry_run != true &&
          startsWith(github.ref, 'refs/heads/')
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Stage ONLY .meta changes (new, updated, or removed orphaned .meta) inside animations/
          if [[ -n "$(find animations -name '*.meta' -print -quit 2>/dev/null)" ]] || [[ -n "$(git ls-files -- ':(glob)animations/**/*.meta')" ]]; then
            git add -A -- ':(glob)animations/**/*.meta'
          fi

          if git diff --cached --quiet; then
            echo "No .meta changes needed; skipping commit."
            exit 0
          fi

          # Safety guard: ensure zero non-.meta or non-animations/ files are ever staged
          while IFS= read -r -d '' staged_file; do
            if [[ "${staged_file}" != animations/*.meta ]]; then
              echo "Safety check failed: unexpected file staged: ${staged_file}" >&2
              exit 1
            fi
          done < <(git diff --cached --name-only -z)

          CREATED_COUNT=$(git diff --cached --diff-filter=A --name-only | wc -l | tr -d ' ')
          UPDATED_COUNT=$(git diff --cached --diff-filter=M --name-only | wc -l | tr -d ' ')
          REMOVED_COUNT=$(git diff --cached --diff-filter=D --name-only | wc -l | tr -d ' ')

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          COMMIT_MSG="chore: generate Unity metadata for FBX animations [skip ci]"
          COMMIT_BODY="Generated: ${CREATED_COUNT}, Updated: ${UPDATED_COUNT}, Removed orphaned: ${REMOVED_COUNT}"

          git commit -m "${COMMIT_MSG}" -m "${COMMIT_BODY}"

          # Rebase safely in case another commit landed on the branch while running
          git pull --rebase origin "${TARGET_BRANCH}"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
